<script>
function iniciarMenu(totalSecciones) {
	var colors = [];
	for (var i = 0; i < totalSecciones; i++) {
		if (i === 0) colors.push('rgba(79,53,40,0.6)');
		else if (i === totalSecciones - 1) colors.push('rgba(79,53,40,1.0)');
		else colors.push('#f8f0e6');
	}
	var anchors = [];
	for (var j = 0; j < totalSecciones; j++) anchors.push((j + 1) + 'a');

	$('#fullpage').fullpage({
		sectionsColor: colors,
		anchors: anchors,
		scrollingSpeed: 500,
		navigation: true,
		continuousVertical: true,
		fitToSection: false
	});
}

/* =====================================================================
   NOMBRES DE LAS SECCIONES (HARDCODEADOS)
   ---------------------------------------------------------------------
   La POSICIÓN en esta lista indica el número de archivo:
     posición 1  ->  imgs/mobile/1.x.svg
     posición 2  ->  imgs/mobile/2.x.svg
     ...
   Para añadir una sección, solo agrega su nombre al final de la lista.
   Si existe N.1.svg pero N no está en la lista, se usa "SECCIÓN N".
   ===================================================================== */
var NOMBRES = [
	'BEBIDAS',            // 1.x.svg
	'ALMUERZO / CENA',    // 2.x.svg
	'DESAYUNO / BRUNCH',  // 3.x.svg
	'HELADOS / POSTRES',  // 4.x.svg
	'OTROS',              // 5.x.svg
	'PRUEBA'              // 6.x.svg
];

var MAX_SLIDES    = 40;
var MAX_SECCIONES = Math.max(NOMBRES.length + 5, 8);

/* ---------------------------------------------------------------------
   CACHÉ PERSISTENTE (localStorage)
   ---------------------------------------------------------------------
   • Al AÑADIR SECCIONES nuevas (7.x.svg…) sube CACHE_KEY (v3, v4…).
     No hace falta tocar sw.js.
   • Al EDITAR un archivo ya existente (2.3.svg, header.svg, fuentes…)
     sube VERSION en sw.js. No hace falta tocar CACHE_KEY.
   • CACHE_TTL es solo una red de seguridad por si olvidas lo anterior.
     Con 12 h, cualquier archivo nuevo aparece como máximo ese plazo
     después, aunque no bumpees nada. Si prefieres que nunca caduque
     solo, ponlo en Infinity y comprométete a bumpear CACHE_KEY.
   --------------------------------------------------------------------- */
var CACHE_KEY = 'menu-mobile-v6';
var CACHE_TTL = 12 * 60 * 60 * 1000;  // 12 horas

</script>
<script>
function getCache() {
	try {
		var raw = localStorage.getItem(CACHE_KEY);
		if (!raw) return null;
		var d = JSON.parse(raw);
		if (!d || d.v !== 2 || !Array.isArray(d.secciones)) return null;
		if (Date.now() - (d.ts || 0) > CACHE_TTL) return null;
		return d;
	} catch (e) { return null; }
}

function setCache(data) {
	try {
		data.v = 2;
		data.ts = Date.now();
		localStorage.setItem(CACHE_KEY, JSON.stringify(data));
	} catch (e) {}
}

/* --- Concurrencia controlada --- */
function pMap(items, fn, concurrency) {
	return new Promise(function(resolve) {
		var results = new Array(items.length);
		var idx = 0, active = 0, done = 0;
		if (!items.length) return resolve(results);
		function next() {
			while (active < concurrency && idx < items.length) {
				(function(i) {
					active++;
					Promise.resolve(fn(items[i], i)).then(function(r) {
						results[i] = r;
					}, function() {
						results[i] = null;
					}).then(function() {
						active--; done++;
						if (done === items.length) resolve(results);
						else next();
					});
				})(idx++);
			}
		}
		next();
	});
}

/* --- Detección de existencia: HEAD como ruta rápida, Image como respaldo --- */
function existe(src) {
	return new Promise(function(ok) {
		var terminado = false;
		function fin(v) { if (!terminado) { terminado = true; clearTimeout(t); ok(v); } }
		// Evita que una petición colgada bloquee la detección completa
		var t = setTimeout(function() { fin(false); }, 4000);

		function porImagen() {
			var i = new Image();
			i.onload  = function() { fin(true);  };
			i.onerror = function() { fin(false); };
			i.src = src;
		}
		if (location.protocol.indexOf('http') === 0 && window.fetch) {
			fetch(src, {method: 'HEAD', cache: 'no-cache'})
				.then(function(r) {
					if (!r.ok) return fin(false);   // 404/403/etc -> no existe
					var ct = (r.headers.get('content-type') || '').toLowerCase();
					// Un 200 con HTML es una página de error, NO una imagen -> no existe
					if (ct.indexOf('text/html') !== -1) return fin(false);
					if (ct === '' || ct.indexOf('image') === 0 || ct.indexOf('svg') !== -1 || ct.indexOf('xml') !== -1 || ct.indexOf('webp') !== -1) {
						fin(true);
					} else {
						porImagen();
					}
				})
				.catch(porImagen);
		} else {
			porImagen();
		}
	});
}

/* Devuelve la URL real de una imagen del menú para N.M:
   prefiere .webp (publicado) y cae a .svg (fuente) si no existe.
   Devuelve null SOLO si ninguno de los dos existe (para detectar huecos). */
function resolver(srcBase) {
	return existe(srcBase + '.webp').then(function(hayWebp) {
		if (hayWebp) return srcBase + '.webp';
		return existe(srcBase + '.svg').then(function(haySvg) {
			return haySvg ? srcBase + '.svg' : null;
		});
	});
}

function detectarSecciones() {
	var lista = [];
	for (var i = 1; i <= MAX_SECCIONES; i++) lista.push(i);
	return pMap(lista, function(sec) {
		var base = 'imgs/mobile/' + sec + '.1';
		return existe(base + '.webp').then(function(hay) {
			if (hay) return sec;
			return existe(base + '.svg').then(function(hay2) {
				return hay2 ? sec : null;
			});
		});
	}, 6).then(function(res) {
		return res.filter(function(s) { return s !== null; });
	});
}

function archivosDe(sec) {
	var lista = [];
	return new Promise(function(resolve) {
		var k = 1;
		function ronda() {
			if (k > MAX_SLIDES) return resolve(lista);
			var lote = [];
			for (var j = 0; j < 4 && k + j <= MAX_SLIDES; j++) {
				lote.push({ n: k + j, base: 'imgs/mobile/' + sec + '.' + (k + j) });
			}
			Promise.all(lote.map(function(p) {
				// resolver() devuelve .webp o .svg; null si no existe ninguno
				return resolver(p.base).then(function(src) {
					return src ? { n: p.n, src: src } : null;
				});
			})).then(function(res) {
				for (var m = 0; m < res.length; m++) {
					if (res[m] === null) return resolve(lista);
					lista.push(res[m].src);
				}
				k += lote.length;
				ronda();
			});
		}
		ronda();
	});
}

/* ---------------------------------------------------------------------
   Detección completa con GUARD anti-truncado:
   si una detección en background falla a medias (red intermitente),
   puede devolver menos secciones o menos slides de las reales. Para
   no pisar la caché buena con una lista truncada, comparamos con la
   anterior y, si la nueva es "peor", conservamos la anterior.
   --------------------------------------------------------------------- */
function detectarCompleto() {
	return detectarSecciones().then(function(secs) {
		return pMap(secs, function(sec) {
			return archivosDe(sec).then(function(slides) {
				return { sec: sec, slides: slides };
			});
		}, 3);
	}).then(function(partes) {
		return { v: 2, ts: Date.now(), secciones: partes };
	});
}

/* --- Orquestador: cache-first, refresh en segundo plano --- */
function detectarMenu() {
	var cached = getCache();

	if (cached) {
		// Refresco silencioso en segundo plano
		if (navigator.onLine !== false) {
			setTimeout(function() {
				detectarCompleto().then(setCache).catch(function() {});
			}, 500);
		}
		return Promise.resolve(cached);
	}

	// Sin caché y sin red: primera visita debe ser online
	if (navigator.onLine === false) {
		return Promise.resolve({ v: 2, ts: Date.now(), secciones: [] });
	}

	// Primera visita: detección completa bloqueante
	return detectarCompleto().then(function(data) {
		setCache(data);
		return data;
	});
}

/* --- Enviar lista de URLs al service worker para que las precachee --- */
function precacheEnSW(data) {
	if (!('serviceWorker' in navigator) || !data || !data.secciones) return;
	var urls = [];
	data.secciones.forEach(function(p) {
		if (p.slides && p.slides.length) urls.push(p.slides[0]);
		p.slides.forEach(function(s) {
			if (urls.indexOf(s) === -1) urls.push(s);
		});
	});
	if (!urls.length) return;
	navigator.serviceWorker.ready.then(function(reg) {
		var sw = reg.active;
		if (sw) sw.postMessage({ type: 'precache', urls: urls });
	}).catch(function() {});
}

function preloadPrimerasSlides(data) {
	if (!data || !data.secciones) return;
	data.secciones.forEach(function(p) {
		if (!p.slides || !p.slides.length) return;
		var l = document.createElement('link');
		l.rel = 'preload';
		l.as = 'image';
		l.href = p.slides[0];   // primera imagen (ya resuelta .webp/.svg)
		document.head.appendChild(l);
	});
}

function slideHtml(src, esPrimero) {
	var loadMode  = esPrimero ? 'eager' : 'lazy';
	var fetchPrio = esPrimero ? 'high'  : 'low';
	return '<div class="slide"><div class="pantalla">'
		+ '<img class="header" src="imgs/mobile/header.svg" alt="">'
		+ '<div class="fotomenu"><img src="' + src + '" alt="" '
		+ 'loading="' + loadMode + '" decoding="async" fetchpriority="' + fetchPrio + '" '
		+ 'width="1080" height="1987"></div>'
		+ '<img class="footer" src="imgs/mobile/footer.svg" alt="">'
		+ '</div></div>';
}

function portadaHtml(sec) {
	var nombre = (NOMBRES[sec - 1] !== undefined) ? NOMBRES[sec - 1] : ('SECCIÓN ' + sec);
	// Igual que el original: slide con imagen de portada + <h2>
	return '<div class="slide" id="fotos"><img src="imgs/bebidas.jpg" alt=""><h2>' + nombre + '</h2></div>';
}

function ocultarCargando() {
	var el = document.getElementById('cargando');
	if (el) {
		el.classList.add('oculto');
		setTimeout(function() { el.parentNode && el.parentNode.removeChild(el); }, 400);
	}
}

$(document).ready(function() {
	// Registrar SW lo antes posible (no bloquea la detección)
	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.register('sw.js').catch(function() {});
	}

	detectarMenu().then(function(data) {
		var contacto = $('#fullpage .section').last();

		data.secciones.forEach(function(parte) {
			var sec = parte.sec;
			var sec$ = $('<div class="section contenido-extra" id="section' + sec + '">'
				+ portadaHtml(sec) + '</div>');
			var slides = '';
			parte.slides.forEach(function(src, i) {
				slides += slideHtml(src, i === 0);
			});
			sec$.append(slides).insertBefore(contacto);
		});

		// Reservar descarga de la 1ª imagen de cada sección
		preloadPrimerasSlides(data);

		iniciarMenu($('#fullpage .section').length);
		setTimeout(ocultarCargando, 60);

		// Precachear todos los SVG detectados en el service worker
		precacheEnSW(data);
	}).catch(function() {
		iniciarMenu($('#fullpage .section').length);
		ocultarCargando();
	});
});
</script>
</head>
